name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  KEELMATRIX_NO_TELEMETRY: '1'

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.425

      - name: Validate release tag and changelog
        id: release-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          pwsh ./scripts/Invoke-ReleaseContract.ps1 -Tag $tag

      - name: Restore from repository NuGet.config
        run: dotnet restore KeelMatrix.FeedFence.sln --configfile NuGet.config --no-cache --force

      - name: Build Release
        run: dotnet build KeelMatrix.FeedFence.sln -c Release --no-restore

      - name: Run CLI contract tests
        run: dotnet run --project tests/FeedFenceCliTests/KeelMatrix.FeedFence.CliTests.csproj -c Release --no-build

      - name: Run Phase 0 probe
        run: dotnet run --project tests/Phase0Probe/KeelMatrix.FeedFence.Phase0Probe.csproj -c Release --no-build

      - name: Run platform fixture
        shell: pwsh
        run: pwsh ./scripts/Invoke-PlatformFixtures.ps1 -Configuration Release

      - name: Audit dependencies
        shell: pwsh
        run: pwsh ./scripts/Invoke-DependencyAudit.ps1

      - name: Run package and consumer gate
        shell: pwsh
        run: pwsh ./scripts/Invoke-PackGate.ps1 -Configuration Release

      - name: Pack exact release artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts) {
            Remove-Item -LiteralPath artifacts -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          dotnet pack src/KeelMatrix.FeedFence/KeelMatrix.FeedFence.csproj -c Release --no-build --no-restore --include-symbols -p:SymbolPackageFormat=snupkg -p:PackageVersion=${{ steps.release-version.outputs.version }} --output artifacts/packages
          pwsh ./scripts/Invoke-ReleaseContract.ps1 -Tag "${{ github.ref_name }}" -ArtifactDirectory artifacts/packages

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feedfence-${{ steps.release-version.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/packages/KeelMatrix.FeedFence.${{ steps.release-version.outputs.version }}.nupkg
            artifacts/packages/KeelMatrix.FeedFence.${{ steps.release-version.outputs.version }}.snupkg

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push package to NuGet.org
        shell: pwsh
        run: >-
          dotnet nuget push
          artifacts/packages/KeelMatrix.FeedFence.${{ steps.release-version.outputs.version }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
